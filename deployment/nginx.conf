server {
    listen 80;
    server_name your_domain.com; # Replace you domain

    location = /favicon.ico { access_log off; log_not_found off; }
    
    # Optional: Serve static via Nginx directly (if not relying entirely on WhiteNoise)
    location /static/ {
        root /path/to/yournexttax; # Adjust to actual absolute path
    }
    location /media/ {
        root /path/to/yournexttax; # Adjust to actual absolute path
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/path/to/yournexttax/gunicorn.sock; # Adjust to actual absolute path
    }
}
