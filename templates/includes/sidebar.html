{% load static %}
<div class="sidebar d-flex flex-column h-100" style="
        background: #0f172a;
        color: #f8fafc;
        border-right: 1px solid #1e293b;
     ">

    <!-- Logo -->
    <div class="text-center py-4 px-3 border-bottom border-secondary border-opacity-25">
        <img src="{% static 'images/sidebar_logo.png' %}" alt="AI Tax System Logo" width="84" height="84"
            class="rounded-4 mx-auto d-block">
    </div>

    <!-- Navigation Menu -->
    <ul class="nav flex-column px-3 py-4 flex-grow-1 overflow-y-auto">
        <li class="nav-item mb-2">
            <a href="{% url 'dashboard' %}"
                class="nav-link rounded-3 p-3 {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2 me-2"></i>
                Dashboard
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'profile' %}"
                class="nav-link rounded-3 p-3 {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                <i class="bi bi-person-circle me-2"></i>
                Taxpayer Profile
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'income_list' %}"
                class="nav-link rounded-3 p-3 {% if 'income' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-cash-stack me-2"></i>
                Income Records
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'deduction_list' %}"
                class="nav-link rounded-3 p-3 {% if 'deduction' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-wallet2 me-2"></i>
                Deductions
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'tax_calculator' %}"
                class="nav-link rounded-3 p-3 {% if 'tax' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-calculator me-2"></i>
                Tax Calculator
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'ai_recommendation' %}"
                class="nav-link rounded-3 p-3 {% if 'ai' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-robot me-2"></i>
                AI Recommendations
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'chatbot' %}"
                class="nav-link rounded-3 p-3 {% if request.resolver_match.url_name == 'chatbot' %}active{% endif %}">
                <i class="bi bi-chat-dots me-2"></i>
                AI Assistant Chat
            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'notifications' %}"
                class="nav-link rounded-3 p-3 {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">
                <i class="bi bi-bell me-2"></i>
                Notifications
                <span id="sidebar-notification-count" class="badge rounded-pill bg-danger ms-auto"
                    style="display: none;">0</span>
            </a>
        </li>
    </ul>

    <!-- Logout Anchor -->
    <div class="p-3 border-top border-secondary border-opacity-25 mt-auto">
        <a href="{% url 'logout' %}" class="btn btn-outline-danger w-100 rounded-3 py-2.5">
            <i class="bi bi-box-arrow-right me-2"></i>
            Logout
        </a>
    </div>

</div>

<style>
    .sidebar .nav-link {
        color: #94a3b8;
        font-weight: 500;
        transition: all 0.25s ease-in-out;
        display: flex;
        align-items: center;
    }

    .sidebar .nav-link:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #f8fafc;
        transform: translateX(4px);
    }

    .sidebar .nav-link.active {
        background: linear-gradient(90deg, #6366f1 0%, #9333ea 100%);
        color: #ffffff;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.25);
    }

    .sidebar .nav-link.active i {
        color: #e9d5ff;
    }

    .fs-7 {
        font-size: 0.75rem;
    }

    .tracking-wide {
        letter-spacing: 0.025em;
    }

    .tracking-wider {
        letter-spacing: 0.05em;
    }
</style>
