<div class="card shadow-lg border-0 mt-4">

    <div class="card-header text-white" style="background: linear-gradient(135deg, #6366f1, #a855f7);">

        <h5 class="mb-0">
            🥧 Income Distribution
        </h5>

    </div>

    <div class="card-body">

        <canvas id="incomePieChart"></canvas>

    </div>

</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const ctx = document.getElementById("incomePieChart");

        new Chart(ctx, {

            type: "doughnut",

            data: {

                labels: [

                    "Income",

                    "Deduction",

                    "Tax"

                ],

                datasets: [

                    {

                        data: [

                            Number("{{ income|default:'0' }}"),

                            Number("{{ deduction|default:'0' }}"),

                            Number("{{ tax|default:'0' }}")

                        ],

                        backgroundColor: [

                            "#0d6efd",

                            "#198754",

                            "#dc3545"

                        ],

                        borderWidth: 2

                    }

                ]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        position: "bottom"

                    }

                }

            }

        });

    });

</script>
