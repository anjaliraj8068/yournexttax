<div class="card border-0 shadow-sm rounded-4 overflow-hidden mt-4">
    <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex align-items-center">
        <h5 class="fw-bold text-dark mb-0 d-flex align-items-center">
            <i class="bi bi-bar-chart-fill text-primary me-2"></i> Tax Analysis
        </h5>
    </div>

    <div class="card-body px-4 pb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fs-8 text-secondary fw-semibold">Tax Burden Ratio</span>
            <span class="fs-8 fw-bold text-danger">{{ tax_percentage }}%</span>
        </div>

        <div class="progress rounded-pill bg-light" style="height: 16px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-gradient bg-danger rounded-pill"
                role="progressbar" data-width="{{ tax_percentage }}" aria-valuenow="{{ tax_percentage }}"
                aria-valuemin="0" aria-valuemax="100" style="width: 0%; transition: width 1s ease-in-out;">
            </div>
        </div>

        <div class="row text-center g-2 mt-4 pt-2 border-top border-light">
            <div class="col-4">
                <span class="text-secondary fs-9 fw-semibold d-block mb-1">Declared</span>
                <span class="text-primary fw-bold fs-75">₹{{ income|default:"0" }}</span>
            </div>
            <div class="col-4 border-start border-end border-light">
                <span class="text-secondary fs-9 fw-semibold d-block mb-1">Liability</span>
                <span class="text-danger fw-bold fs-75">₹{{ tax|default:"0" }}</span>
            </div>
            <div class="col-4">
                <span class="text-secondary fs-9 fw-semibold d-block mb-1">Total Saved</span>
                <span class="text-success fw-bold fs-75">₹{{ tax_saving|default:"0" }}</span>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
            document.querySelectorAll(".progress-bar").forEach(function (bar) {
                bar.style.width = bar.dataset.width + "%";
            });
        }, 100);
    });
</script>

<style>
    .fs-75 {
        font-size: 0.9rem;
    }

    .fs-8 {
        font-size: 0.85rem;
    }

    .fs-9 {
        font-size: 0.75rem;
    }

    .bg-light {
        background-color: #f1f5f9 !important;
    }
</style>
